# Dependencias de runtime para ingest_job.py (Fase 5b — Cloud Run Job).
#
# Excluye: dev (pytest, ruff, coverage), notebooks (jupyter*, ipython*,
# nbclient, etc.) y xgboost (no usado en el job — solo en evaluación local).
# nba_predictor mismo se instala vía COPY + PYTHONPATH en el Dockerfile.
#
# Para regenerar (desde el venv del proyecto, con todas las deps instaladas):
#   pip freeze \
#     | grep -vE '^(pytest|pytest-cov|coverage|ruff|debugpy|iniconfig|pluggy)' \
#     | grep -vE '^(jupyter|nbclient|nbconvert|nbformat|notebook|ipython|ipykernel)' \
#     | grep -vE '^(ipywidgets|jupyterlab|comm|traitlets|prompt.toolkit|tornado)' \
#     | grep -vE '^(anyio|h11|httpcore|httpx|websocket.client|terminado|pywinpty)' \
#     | grep -vE '^(babel|arrow|jedi|parso|asttokens|executing|decorator|stack.data)' \
#     | grep -vE '^(nest.asyncio|async.lru|Jinja2|MarkupSafe|mistune|pandocfilters)' \
#     | grep -vE '^(bleach|tinycss2|webencodings|defusedxml|fastjsonschema|referencing)' \
#     | grep -vE '^(jsonschema|attrs|json5|jsonpointer|uri.template|fqdn|isoduration)' \
#     | grep -vE '^(rfc3339|rfc3986|rfc3987|webcolors|Send2Trash|argon2|platformdirs)' \
#     | grep -vE '^(prometheus.client|psutil|pyzmq|python.json.logger|PyYAML|pywinpty)' \
#     | grep -vE '^(wcwidth|widgetsnbextension|matplotlib.inline|pure.eval|colorama)' \
#     | grep -vE '^(xgboost|setuptools|-e git\+)' \
#     > requirements.lock

